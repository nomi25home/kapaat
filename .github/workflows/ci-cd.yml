name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
    tags: ["v*", "[0-9]*"] # accept both v1.2.3 and 1.2.3 tag formats
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kapaat_test
          POSTGRES_USER: kapaat
          POSTGRES_PASSWORD: kapaat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kapaat -d kapaat_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrations match models
        run: uv run alembic upgrade head && uv run alembic check
        env:
          DATABASE_URL: postgresql+psycopg://kapaat:kapaat@localhost:5432/kapaat_test
          SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
      - name: Tests
        run: uv run pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://kapaat:kapaat@localhost:5432/kapaat_test

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Build & push ${{ matrix.service }} image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: backend
          - service: web
            context: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kapaat-${{ matrix.service }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
