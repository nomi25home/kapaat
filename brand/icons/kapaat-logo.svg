<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#1a2d3d"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="36" y1="44" x2="164" y2="164">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="100%" stop-color="#2ab8d8"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>

  <!-- Cabinet body -->
  <rect x="36" y="44" width="128" height="120" rx="8" fill="none" stroke="url(#accent)" stroke-width="5"/>

  <!-- Horizontal divider (middle shelf) -->
  <line x1="36" y1="104" x2="164" y2="104" stroke="url(#accent)" stroke-width="4"/>

  <!-- Vertical divider (center column split) -->
  <line x1="100" y1="44" x2="100" y2="164" stroke="url(#accent)" stroke-width="3"/>

  <!-- Door handles — top left -->
  <circle cx="88" cy="78" r="5" fill="#4cd7f6" opacity="0.9"/>
  <!-- Door handles — top right -->
  <circle cx="112" cy="78" r="5" fill="#4cd7f6" opacity="0.9"/>
  <!-- Door handles — bottom left -->
  <circle cx="88" cy="134" r="5" fill="#4cd7f6" opacity="0.6"/>
  <!-- Door handles — bottom right -->
  <circle cx="112" cy="134" r="5" fill="#4cd7f6" opacity="0.6"/>

  <!-- Feet -->
  <rect x="52" y="164" width="12" height="10" rx="3" fill="#4cd7f6" opacity="0.5"/>
  <rect x="136" y="164" width="12" height="10" rx="3" fill="#4cd7f6" opacity="0.5"/>
</svg>
