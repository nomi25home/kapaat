<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin {{ bin.bin_id }} — Kapaat Scan</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background-color: var(--bg-main, #0b1326);
            color: var(--text-main, #f3f4f6);
            font-family: var(--font-sans, system-ui, sans-serif);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .scan-card {
            width: 100%;
            max-width: 480px;
            background: var(--bg-surface, #131d35);
            border: 1px solid var(--border-color, #1e293b);
            border-radius: 12px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .bin-header {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent, #4cd7f6);
            margin-bottom: 8px;
        }
        .bin-meta {
            font-size: 1rem;
            color: var(--text-muted, #94a3b8);
            margin-bottom: 24px;
        }
        .qr-container img {
            width: 200px;
            height: 200px;
            border-radius: 8px;
            border: 4px solid white;
            background: white;
            margin-bottom: 24px;
        }
        .item-list {
            text-align: left;
            margin-top: 16px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color, #1e293b);
        }
        .item-name {
            font-weight: 600;
        }
        .item-qty {
            background: var(--accent-subtle, rgba(76, 215, 246, 0.1));
            color: var(--accent, #4cd7f6);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="scan-card">
        <div class="bin-header">{{ bin.bin_id }}</div>
        <div class="bin-meta">Zone: {{ bin.zone }} | Shelf: {{ bin.shelf_number }}</div>

        <div class="qr-container">
            <img src="{{ qr_url }}" alt="QR Code">
        </div>

        <h3>Items in this Bin</h3>
        {% if items %}
        <div class="item-list">
            {% for item in items %}
            <div class="item-row">
                <div>
                    <div class="item-name">{{ item.name }}</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted, #94a3b8);">{{ item.category }}</div>
                </div>
                <div>
                    <span class="item-qty">x{{ item.quantity }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <p style="color: var(--text-muted, #94a3b8);">This bin is currently empty.</p>
        {% endif %}
    </div>
</body>
</html>
