[project]
name = "kapaat"
version = "1.3.3"
description = "Self-hosted storage bin inventory system tracking physical box locations and contents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mihir Patel" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Database",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pandas>=2.2.1",
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
    "aiofiles>=23.2.1",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.1.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # Ruff-specific
]
ignore = [
    "B008",   # FastAPI File(...)/Form(...) in default args is intentional
    "BLE001", # Broad except is intentional in fire-and-forget webhook/backup handlers
    "RUF005", # List concat style is fine
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
