services:
  kapaat:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/nomi25home/kapaat:latest
    container_name: garage-storage
    restart: unless-stopped
    ports:
      - 8099:8096
    volumes:
      - garage_data:/data
    dns:
      - 192.168.74.28
      - 192.168.74.33
    env_file:
      - .env
volumes:
  garage_data: null
networks: {}