[project]
name = "kapaat"
version = "2.0.0"
description = "Self-hosted home storage inventory: rooms, zones, bins, items."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "qrcode>=7.4",
  "reportlab>=4.2",
  "pillow>=10.4",
  "authlib>=1.3",
  "webauthn>=2.2",
  "httpx>=0.27",
  "email-validator>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pypdf>=4"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
