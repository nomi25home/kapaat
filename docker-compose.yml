services:
  garage-storage:
    image: ghcr.io/nomi25home/kapaat:1
    container_name: garage-storage
    restart: unless-stopped
    ports:
      - "8099:8096"
    volumes:
      - garage_data:/data
    dns:
      - 192.168.74.28
      - 192.168.74.33
    environment:
      - TZ=America/New_York
      - PYTHONUNBUFFERED=1
      - BASE_URL=${BASE_URL:-http://localhost:8099}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}  # required: generate with: openssl rand -base64 32

volumes:
  garage_data:
