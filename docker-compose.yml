# Kapaat v2 — copy .env.example to .env, fill in SECRET_KEY and BASE_URL, then: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kapaat
      POSTGRES_USER: kapaat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - kapaat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapaat -d kapaat"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/nomi25home/kapaat-api:${KAPAAT_VERSION:-2}
    build: ./backend
    restart: unless-stopped
    env_file: ${KAPAAT_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://kapaat:${POSTGRES_PASSWORD}@db:5432/kapaat
    volumes:
      - kapaat_photos:/data/photos
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/nomi25home/kapaat-web:${KAPAAT_VERSION:-2}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${KAPAAT_PORT:-8099}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  kapaat_pg:
  kapaat_photos:
